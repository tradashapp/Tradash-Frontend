<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="112" fill="#72E912"/>
  <!--
    "T" whose vertical stem is a lightning bolt.
    Top bar of the T + a zig-zag bolt descending as the stem. Solid black glyph.
  -->
  <g fill="#08090c">
    <!-- Top bar of the T -->
    <rect x="120" y="128" width="272" height="54" rx="12"/>
    <!-- Lightning-bolt stem: connects to the bar and descends as the T's stroke -->
    <path d="M292 178
             L206 300
             L258 300
             L222 402
             L336 262
             L280 262
             L322 178
             Z"/>
  </g>
</svg>
